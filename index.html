<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7336 프로리그 참가인원 점수 계산기</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --card-inner: #1c2740;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #2e3d5e;
      --highlight: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* 최상단 제목 */
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-color);
      text-shadow: 0 0 15px var(--accent-glow);
      letter-spacing: -0.5px;
    }

    /* 상단 버튼 */
    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 700;
      border: 2px solid var(--accent-color);
      background-color: transparent;
      color: var(--accent-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active, .tab-btn:hover {
      background-color: var(--accent-color);
      color: #0b0f19;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* 탭 메인 컨테이너 */
    .tab-content {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .tab-content.active {
      display: block;
    }

    /* 첫 번째 버튼: 4개 팀 영역 */
    .team-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    @media (max-width: 1100px) {
      .team-grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .team-grid-4 {
        grid-template-columns: 1fr;
      }
    }

    .team-card {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .team-card h3 {
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 12px;
      font-size: 1.25rem;
      text-align: center;
      font-weight: 700;
    }

    .member-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .member-table th, .member-table td {
      padding: 8px 4px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .member-table th {
      color: var(--text-muted);
      font-weight: 600;
    }

    .member-table td.name {
      font-weight: 600;
    }

    .member-table td.grade {
      color: var(--accent-color);
    }

    .member-table td.score {
      color: var(--highlight);
      font-weight: 700;
    }

    /* [수정사항 1] 팀선택 영역 텍스트 짤림 및 줄바꿈 방지 */
    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-inner);
      padding: 18px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      gap: 16px;
      flex-wrap: nowrap;
    }

    .team-select-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .team-select-box label {
      white-space: nowrap;
    }

    .team-select-box select {
      font-size: 1rem;
      padding: 8px 16px;
      font-weight: bold;
      color: var(--accent-color);
      white-space: nowrap;
    }

    .total-score-box {
      font-size: 1.3rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .total-score {
      color: var(--highlight);
      font-size: 2.2rem;
      margin-left: 8px;
    }

    /* 경기 카드 레이아웃 컨테이너 */
    .matches-layout {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 첫 번째 행 (경기 1~4) */
    .row-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    /* 두 번째 행 (경기 5~7) */
    .row-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 900px) {
      .row-grid-4, .row-grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .row-grid-4, .row-grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* 경기 카드 스타일 */
    .match-card {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-header {
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 10px;
      text-align: center;
    }

    .match-title {
      font-weight: 800;
      color: var(--accent-color);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .match-score {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .match-score span {
      color: var(--highlight);
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* 인원 수직(같은 열) 배치 */
    .player-select-group-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .select-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .select-box label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    select {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }

    select:focus {
      border-color: var(--accent-color);
    }

    select option:disabled {
      color: #64748b;
      background-color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 최상단 제목 -->
    <h1>7336 프로리그 참가인원 점수 계산기</h1>

    <!-- 상단 버튼 -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('teamTab', this)">팀별 인원 보기</button>
      <button class="tab-btn" onclick="switchTab('calcTab', this)">점수 계산기</button>
    </div>

    <!-- 첫 번째 버튼: 팀별 인원 보기 -->
    <div id="teamTab" class="tab-content active">
      <div id="teamGrid" class="team-grid-4"></div>
    </div>

    <!-- 두 번째 버튼: 점수 계산기 -->
    <div id="calcTab" class="tab-content">
      <div class="calc-header">
        <div class="team-select-box">
          <label for="teamSelect">팀 선택:</label>
          <select id="teamSelect" onchange="onTeamChange()">
            <!-- JS로 동적 생성 -->
          </select>
        </div>
        <div class="total-score-box">
          총 점수: <span id="totalScore" class="total-score">0</span> 점
        </div>
      </div>

      <!-- 경기 1~4(첫 번째 행), 경기 5~7(두 번째 행) 레이아웃 -->
      <div class="matches-layout">
        <div id="row1Container" class="row-grid-4"></div>
        <div id="row2Container" class="row-grid-3"></div>
      </div>
    </div>
  </div>

  <script>
    // 명단 데이터
    const playersData = [
      // 더듬 팀
      { name: "엠비", grade: "SC", score: 7, team: "더듬" },
      { name: "케이", grade: "SC", score: 7, team: "더듬" },
      { name: "루시퍼", grade: "SC", score: 7, team: "더듬" },
      { name: "휴지", grade: "SC", score: 7, team: "더듬" },
      { name: "더듬", grade: "SD", score: 6, team: "더듬" },
      { name: "뉴알", grade: "SD", score: 6, team: "더듬" },
      { name: "hjwoe", grade: "SD", score: 6, team: "더듬" },
      { name: "춘자", grade: "SF", score: 5, team: "더듬" },
      { name: "스케흐", grade: "SF", score: 5, team: "더듬" },
      { name: "수박", grade: "A", score: 4, team: "더듬" },
      { name: "모비", grade: "A", score: 4, team: "더듬" },
      { name: "소라", grade: "A", score: 4, team: "더듬" },
      { name: "jrjs", grade: "B", score: 3, team: "더듬" },
      { name: "롱", grade: "C", score: 2, team: "더듬" },
      { name: "핑쿠짱", grade: "D", score: 1, team: "더듬" },

      // 미또 팀
      { name: "로까", grade: "SC", score: 7, team: "미또" },
      { name: "341", grade: "SC", score: 7, team: "미또" },
      { name: "미또", grade: "SC", score: 7, team: "미또" },
      { name: "마맨", grade: "SD", score: 6, team: "미또" },
      { name: "리퍼", grade: "SD", score: 6, team: "미또" },
      { name: "랜덤", grade: "SD", score: 6, team: "미또" },
      { name: "마인드", grade: "SD", score: 6, team: "미또" },
      { name: "도그", grade: "SD", score: 6, team: "미또" },
      { name: "위너", grade: "SF", score: 5, team: "미또" },
      { name: "캡틴", grade: "SF", score: 5, team: "미또" },
      { name: "앤가든", grade: "A", score: 4, team: "미또" },
      { name: "맥콜", grade: "A", score: 4, team: "미또" },
      { name: "바나나", grade: "A", score: 4, team: "미또" },
      { name: "파이어", grade: "B", score: 3, team: "미또" },
      { name: "팔구", grade: "D", score: 1, team: "미또" },

      // 신비 팀
      { name: "영차", grade: "SA", score: 9, team: "신비" },
      { name: "비트", grade: "SC", score: 7, team: "신비" },
      { name: "이천", grade: "SC", score: 7, team: "신비" },
      { name: "저스틴", grade: "SD", score: 6, team: "신비" },
      { name: "허벅", grade: "SD", score: 6, team: "신비" },
      { name: "스노볼", grade: "SD", score: 6, team: "신비" },
      { name: "박서", grade: "SF", score: 5, team: "신비" },
      { name: "엔젤럽", grade: "SF", score: 5, team: "신비" },
      { name: "노웨이", grade: "SF", score: 5, team: "신비" },
      { name: "신비", grade: "A", score: 4, team: "신비" },
      { name: "1.0mg", grade: "A", score: 4, team: "신비" },
      { name: "파인", grade: "A", score: 4, team: "신비" },
      { name: "희진럽", grade: "A", score: 4, team: "신비" },
      { name: "안", grade: "B", score: 3, team: "신비" },
      { name: "수고", grade: "C", score: 2, team: "신비" },
      { name: "조아", grade: "C", score: 2, team: "신비" },

      // 헤이든 팀
      { name: "순삼", grade: "SB", score: 8, team: "헤이든" },
      { name: "로이", grade: "SC", score: 7, team: "헤이든" },
      { name: "스타돗", grade: "SD", score: 6, team: "헤이든" },
      { name: "헤이든", grade: "SD", score: 6, team: "헤이든" },
      { name: "뱅", grade: "SD", score: 6, team: "헤이든" },
      { name: "헌트", grade: "SD", score: 6, team: "헤이든" },
      { name: "30", grade: "SD", score: 6, team: "헤이든" },
      { name: "코코사", grade: "SF", score: 5, team: "헤이든" },
      { name: "레딜제", grade: "SF", score: 5, team: "헤이든" },
      { name: "천원", grade: "A", score: 4, team: "헤이든" },
      { name: "마린옵", grade: "A", score: 4, team: "헤이든" },
      { name: "바름", grade: "A", score: 4, team: "헤이든" },
      { name: "T1", grade: "A", score: 4, team: "헤이든" },
      { name: "썬", grade: "B", score: 3, team: "헤이든" },
      { name: "최", grade: "B", score: 3, team: "헤이든" }
    ];

    const row1Configs = [
      { id: 1, name: "경기 1 (2대2)", count: 2 },
      { id: 2, name: "경기 2 (2대2)", count: 2 },
      { id: 3, name: "경기 3 (3대3)", count: 3 },
      { id: 4, name: "경기 4 (3대3)", count: 3 }
    ];

    const row2Configs = [
      { id: 5, name: "경기 5 (4대4)", count: 4 },
      { id: 6, name: "경기 6 (4대4)", count: 4 },
      { id: 7, name: "경기 7 (1대1)", count: 1 }
    ];

    const allConfigs = [...row1Configs, ...row2Configs];
    const targetTeams = ["신비", "헤이든", "더듬", "미또"];

    // 탭 전환
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // 팀별 인원 보기
    function renderTeamView() {
      const teamGrid = document.getElementById('teamGrid');

      teamGrid.innerHTML = targetTeams.map(teamName => {
        const teamPlayers = playersData.filter(p => p.team === teamName);
        const rows = teamPlayers.map(p => `
          <tr>
            <td class="name">${p.name}</td>
            <td class="grade">${p.grade}</td>
            <td class="score">${p.score}</td>
          </tr>
        `).join('');

        return `
          <div class="team-card">
            <h3>${teamName} (${teamPlayers.length}명)</h3>
            <table class="member-table">
              <thead>
                <tr>
                  <th>이름</th>
                  <th>등급</th>
                  <th>점수</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    // 계산기 초기화
    function initCalculator() {
      const teamSelect = document.getElementById('teamSelect');
      teamSelect.innerHTML = targetTeams.map(t => `<option value="${t}">${t} 팀</option>`).join('');

      renderMatches();
      updatePlayerSelectOptions();
      calculateTotal();
    }

    // 경기 카드 HTML 생성
    function createMatchCardHTML(m, teamPlayers) {
      let selects = '';
      for (let i = 1; i <= m.count; i++) {
        const options = teamPlayers.map(p => 
          `<option value="${p.name}" data-score="${p.score}">${p.name} (${p.grade} / ${p.score}점)</option>`
        ).join('');

        selects += `
          <div class="select-box">
            <label>선수 ${i}</label>
            <select class="match-player-select" data-match="${m.id}" onchange="onPlayerSelectChange()">
              <option value="">-- 선택 --</option>
              ${options}
            </select>
          </div>
        `;
      }

      return `
        <div class="match-card">
          <div class="match-header">
            <div class="match-title">${m.name}</div>
            <div class="match-score">소계: <span id="match-score-${m.id}">0</span>점</div>
          </div>
          <div class="player-select-group-col">
            ${selects}
          </div>
        </div>
      `;
    }

    // 행별로 나누어 렌더링
    function renderMatches() {
      const row1Container = document.getElementById('row1Container');
      const row2Container = document.getElementById('row2Container');
      const selectedTeam = document.getElementById('teamSelect').value;
      const teamPlayers = playersData.filter(p => p.team === selectedTeam);

      row1Container.innerHTML = row1Configs.map(m => createMatchCardHTML(m, teamPlayers)).join('');
      row2Container.innerHTML = row2Configs.map(m => createMatchCardHTML(m, teamPlayers)).join('');
    }

    // [수정사항 2] 선수 선택 변경 시 중복 체크(최대 2회) 및 점수 합산
    function onPlayerSelectChange() {
      updatePlayerSelectOptions();
      calculateTotal();
    }

    // [수정사항 2] 선수별 선택 횟수 계산 및 3회 이상 선택 방지 옵션 비활성화
    function updatePlayerSelectOptions() {
      const allSelects = document.querySelectorAll('.match-player-select');
      
      // 현재 선택된 선수별 선택 횟수 카운트
      const selectedCounts = {};
      allSelects.forEach(select => {
        const val = select.value;
        if (val) {
          selectedCounts[val] = (selectedCounts[val] || 0) + 1;
        }
      });

      // 모든 드롭다운 옵션의 disabled 상태 업데이트
      allSelects.forEach(select => {
        const currentValue = select.value;
        Array.from(select.options).forEach(option => {
          const playerName = option.value;
          if (!playerName) return; // '-- 선택 --' 옵션 패스

          const count = selectedCounts[playerName] || 0;

          // 해당 드롭다운에서 현재 자신이 이미 선택한 값은 항상 활성화
          if (playerName === currentValue) {
            option.disabled = false;
            option.text = `${playerName} (${getPlayerInfoText(playerName)})`;
          } else if (count >= 2) {
            // 이미 다른 경기들에서 2번 이상 선택된 경우 3회차부터 비활성화
            option.disabled = true;
            option.text = `${playerName} (2회 선택 완료)`;
          } else {
            option.disabled = false;
            option.text = `${playerName} (${getPlayerInfoText(playerName)})`;
          }
        });
      });
    }

    // 옵션에 표시할 선수 정보 텍스트 가져오기
    function getPlayerInfoText(playerName) {
      const player = playersData.find(p => p.name === playerName);
      return player ? `${player.grade} / ${player.score}점` : '';
    }

    // 팀 선택 변경 시
    function onTeamChange() {
      renderMatches();
      updatePlayerSelectOptions();
      calculateTotal();
    }

    // 점수 자동 합산
    function calculateTotal() {
      let grandTotal = 0;

      allConfigs.forEach(m => {
        const selects = document.querySelectorAll(`.match-player-select[data-match="${m.id}"]`);
        let matchSum = 0;

        selects.forEach(s => {
          const selectedName = s.value;
          if (selectedName) {
            const player = playersData.find(p => p.name === selectedName);
            if (player) {
              matchSum += player.score;
            }
          }
        });

        const scoreElem = document.getElementById(`match-score-${m.id}`);
        if (scoreElem) {
          scoreElem.innerText = matchSum;
        }
        grandTotal += matchSum;
      });

      document.getElementById('totalScore').innerText = grandTotal;
    }

    // 초기 로드
    window.onload = () => {
      renderTeamView();
      initCalculator();
    };
  </script>
</body>
</html>
