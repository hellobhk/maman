<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>제2회 7336 프로리그</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --card-inner: #1c2740;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #2e3d5e;
      --highlight: #f59e0b;

      /* 팀 시그니처 컬러 */
      --color-sinbi: #3b82f6;   /* 신비 */
      --color-deodeum: #eab308; /* 더듬 */
      --color-hayden: #ef4444;  /* 헤이든 */
      --color-mitto: #ec4899;   /* 미또 */

      --win-color: #10b981;
      --loss-color: #ef4444;
      --draw-color: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 1200px; }
    
    h1 { text-align: center; margin-bottom: 16px; font-size: 1.35rem; font-weight: 800; color: var(--accent-color); text-shadow: 0 0 15px var(--accent-glow); letter-spacing: -0.5px; word-break: keep-all; }
    @media (min-width: 768px) { h1 { font-size: 2.2rem; margin-bottom: 24px; } body { padding: 24px; } }

    .tab-buttons { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; width: 100%; }
    .tab-btn { flex: 1; max-width: 220px; padding: 10px 12px; font-size: 0.9rem; font-weight: 700; border: 2px solid var(--accent-color); background-color: transparent; color: var(--accent-color); border-radius: 10px; cursor: pointer; transition: all 0.25s ease; text-align: center; white-space: nowrap; }
    .tab-btn.active, .tab-btn:hover { background-color: var(--accent-color); color: #0b0f19; box-shadow: 0 0 15px var(--accent-glow); }

    /* 계좌 안내 문구 스타일 */
    .sponsor-info {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.6;
      word-break: keep-all;
    }
    .sponsor-info span {
      display: block;
    }
    .sponsor-info span:first-child {
      margin-bottom: 4px;
    }

    .tab-content { display: none; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); }
    @media (min-width: 768px) { .tab-content { padding: 24px; } }
    .tab-content.active { display: block; }

    /* 팀별 인원 보기 */
    .team-grid-4 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px) { .team-grid-4 { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
    @media (min-width: 1024px) { .team-grid-4 { grid-template-columns: repeat(4, 1fr); } }

    .team-card { background-color: var(--card-inner); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .team-card h3 { border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 10px; font-size: 1.1rem; text-align: center; font-weight: 800; }

    .team-sinbi { color: var(--color-sinbi) !important; }
    .team-deodeum { color: var(--color-deodeum) !important; }
    .team-hayden { color: var(--color-hayden) !important; }
    .team-mitto { color: var(--color-mitto) !important; }

    .member-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
    .member-table th, .member-table td { padding: 6px 2px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member-table th { color: var(--text-muted); font-weight: 600; }
    .member-table td.name { font-weight: 600; }
    .member-table td.score { color: var(--highlight); font-weight: 700; }

    /* 일정 및 순위 Layout */
    .schedule-standings-container { display: flex; flex-direction: column; gap: 20px; }
    @media (min-width: 900px) { 
      .schedule-standings-container { 
        display: grid; 
        grid-template-columns: 0.8fr 1.2fr; 
        gap: 24px;
      } 
    }

    .section-title { font-size: 1.1rem; font-weight: 800; color: var(--accent-color); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .schedule-list { display: flex; flex-direction: column; gap: 10px; }
    .schedule-item { background-color: var(--card-inner); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: all 0.2s ease; }
    
    /* 지난/완료된 경기 스타일 */
    .schedule-item.completed {
      background-color: #111726;
      border-color: #1e293b;
      opacity: 0.7;
    }
    .schedule-item.completed:hover {
      opacity: 0.9;
    }
    .status-badge {
      font-size: 0.68rem;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: bold;
      margin-left: 6px;
      white-space: nowrap;
    }
    .badge-completed { background-color: #334155; color: #94a3b8; }
    .badge-upcoming { background-color: #0284c7; color: #ffffff; }

    .schedule-header { 
      padding: 10px 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      cursor: pointer; 
      background-color: rgba(255, 255, 255, 0.02); 
      transition: background-color 0.2s ease;
      gap: 8px;
    }
    .schedule-header:hover { background-color: rgba(255, 255, 255, 0.05); }
    
    .schedule-info { 
      display: flex; 
      flex-direction: column; 
      gap: 3px; 
      min-width: 0;
      flex: 1;
    }
    .schedule-date { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      display: flex; 
      align-items: center; 
      white-space: nowrap;
    }
    .schedule-teams { 
      font-size: 0.95rem; 
      font-weight: 800; 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      white-space: nowrap; 
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .schedule-teams span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .schedule-result-box {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .schedule-score { 
      font-size: 1rem; 
      font-weight: 800; 
      color: var(--highlight); 
      padding: 3px 8px; 
      background-color: var(--bg-color); 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
      white-space: nowrap;
    }
    .toggle-icon { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      margin-left: 2px; 
      transition: transform 0.25s ease; 
      flex-shrink: 0;
    }
    .schedule-item.active .toggle-icon { transform: rotate(180deg); }

    /* 상세 경기 테이블 모바일 대응 스타일 */
    .schedule-detail { display: none; padding: 8px 4px; border-top: 1px dashed var(--border-color); background-color: var(--bg-color); }
    .schedule-item.active .schedule-detail { display: block; }
    
    .detail-match-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; table-layout: auto; }
    .detail-match-table th, .detail-match-table td { padding: 5px 2px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle; }
    .detail-match-table th { color: var(--text-muted); font-size: 0.72rem; }

    /* 경기명 괄호 하단 배치 처리 */
    .detail-match-table td.match-title {
      text-align: left;
      font-weight: bold;
      color: var(--accent-color);
      white-space: normal;
      line-height: 1.25;
      padding-left: 2px;
    }
    .detail-match-table td.match-title span.match-sub {
      display: block;
      font-weight: normal;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* 출전 선수 이름 및 점수 표시 */
    .detail-match-table td.players-cell {
      word-break: keep-all;
      word-wrap: break-word;
      line-height: 1.3;
      padding: 4px 2px;
    }
    .players-score {
      color: var(--highlight);
      font-weight: 600;
      font-size: 0.73rem;
      margin-left: 2px;
      white-space: nowrap;
    }

    /* 스코어(결과) 줄바꿈 방지 */
    .detail-match-table td.score-cell {
      font-weight: bold;
      white-space: nowrap !important;
      padding: 4px 2px;
    }

    .winner-pts { color: var(--win-color); font-weight: bold; }

    .standings-card { background-color: var(--card-inner); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; }
    .standings-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .standings-table th, .standings-table td { padding: 8px 2px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .standings-table th { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; }
    .rank-num { font-weight: bold; color: var(--accent-color); }
    .pts-num { color: var(--highlight); font-weight: bold; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>제2회 7336 프로리그</h1>

    <!-- 탭 버튼 -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('scheduleTab', this)">일정 및 순위</button>
      <button class="tab-btn" onclick="switchTab('teamTab', this)">팀별 인원 보기</button>
    </div>

    <!-- 안내 텍스트 -->
    <div class="sponsor-info">
      <span>찬조금 후원 계좌 : 기업 68202508701039 이소영</span>
      <span>마맨 커피값 계좌 : 국민 04390204165650 배효관</span>

    <!-- 1. 일정 및 순위 (기본 활성화) -->
    <div id="scheduleTab" class="tab-content active">
      <div class="schedule-standings-container">
        
        <!-- 상단: 팀 순위표 -->
        <div>
          <div class="section-title">팀 순위표</div>

            <table class="standings-table">

                  <th>팀명</th>
                  <th>경기</th>
                  <th>승/무/패</th>
                  <th>단판승합</th>
                  <th>승점</th>
                </tr>
              </thead>
              <tbody id="standingsBody"></tbody>
            </table>
          </div>
        </div>

        <!-- 하단: 경기 일정 및 결과 -->

          </div>

    const playersData = [
      // 페이지 노출되지 않는 대체 인원 (팀명 비워둠)

      { name: "앤가든", grade: "A", score: 4, team: "미또" },
      { name: "맥콜", grade: "A", score: 4, team: "미또" },

      { name: "영차", grade: "SA", score: 9, team: "신비" },

      { name: "순삼", grade: "SB", score: 8, team: "헤이든" },
      { name: "로이", grade: "SC", score: 7, team: "헤이든" },
      { name: "스타돗", grade: "SD", score: 6, team: "헤이든" },
      { name: "헤이든", grade: "SD", score: 6, team: "헤이든" },
      { name: "뱅", grade: "SD", score: 6, team: "헤이든" },
      { name: "헌트", grade: "SD", score: 6, team: "헤이든" },

      { name: "레딜제", grade: "SF", score: 5, team: "헤이든" },
      { name: "천원", grade: "A", score: 4, team: "헤이든" },
      { name: "마린옵", grade: "A", score: 4, team: "헤이든" },
      { name: "바름", grade: "A", score: 4, team: "헤이든" },

      { name: "최", grade: "B", score: 3, team: "헤이든" }
    ];

    // 더듬과 헤이든의 순서를 교체 (신비, 헤이든, 더듬, 미또)
    const targetTeams = ["신비", "헤이든", "더듬", "미또"];
    let matchSchedules = [];

    // 선수 이름으로 점수 조회하는 Map 객체 미리 생성
    const playerScoreMap = new Map();
    playersData.forEach(p => playerScoreMap.set(p.name.trim(), Number(p.score) || 0));

    // 출전 선수 목록 합계 점수 계산 및 텍스트 렌더링 함수
    function renderPlayersWithScore(players) {
      if (!players || players.length === 0) return '-';
      
      let totalScore = 0;
      players.forEach(name => {
        const trimmedName = name.trim();
        if (playerScoreMap.has(trimmedName)) {
          totalScore += playerScoreMap.get(trimmedName);
        }
      });

      const playerNamesStr = players.join(', ');
      return `${playerNamesStr} <span class="players-score">(합계: ${totalScore}점)</span>`;
    }

    function getTeamColorClass(teamName) {
      switch(teamName) {
        case "신비": return "team-sinbi";
        case "더듬": return "team-deodeum";
        case "헤이든": return "team-hayden";
        case "미또": return "team-mitto";
        default: return "";
      }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function renderTeamView() {
      const teamGrid = document.getElementById('teamGrid');
      teamGrid.innerHTML = targetTeams.map(teamName => {
        // targetTeams에 포함된 공식 소속팀 인원만 카드에 표시
        const teamPlayers = playersData.filter(p => p.team === teamName);
        const colorClass = getTeamColorClass(teamName);

        const rows = teamPlayers.map(p => `
          <tr>
            <td class="name">${p.name}</td>
            <td class="grade">${p.grade}</td>
            <td class="score">${p.score}</td>
          </tr>
        `).join('');

        return `
          <div class="team-card">
            <h3 class="${colorClass}">${teamName} (${teamPlayers.length}명)</h3>
            <table class="member-table">
              <thead><tr><th>이름</th><th>등급</th><th>점수</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    async function loadSchedulesFromGoogleSheet() {
      const scheduleContainer = document.getElementById('scheduleList');
      if (scheduleContainer) {
        scheduleContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">구글 시트에서 데이터를 불러오는 중...</div>';
      }

      try {
        const response = await fetch(GOOGLE_SHEET_API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          matchSchedules = data;
        }
        renderScheduleAndStandings();
      } catch (error) {
        console.error("구글 시트 연동 실패:", error);
        if (scheduleContainer) {
          scheduleContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--loss-color);">구글 시트 데이터를 가져오지 못했습니다.</div>';
        }
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      if (typeof dateStr === 'string' && !dateStr.includes('T')) {
        return dateStr;
      }

      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;

      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');

      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function formatMatchTitle(matchName) {
      if (!matchName) return '';
      const match = matchName.match(/^(.*?)\s*(\(.*?\))$/);
      if (match) {
        return `${match[1]} <span class="match-sub">${match[2]}</span>`;
      }
      return matchName;
    }

    function renderScheduleAndStandings() {
      renderScheduleList();
      renderStandings();
    }

    function renderScheduleList() {
      const scheduleContainer = document.getElementById('scheduleList');
      if (!matchSchedules || matchSchedules.length === 0) {
        scheduleContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">등록된 경기 일정이 없습니다.</div>';
        return;
      }

      const now = new Date();

      const sortedSchedules = [...matchSchedules].sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);

        const isPastA = dateA < now;
        const isPastB = dateB < now;

        if (!isPastA && isPastB) return -1;
        if (isPastA && !isPastB) return 1;

        return dateA - dateB;
      });

      scheduleContainer.innerHTML = sortedSchedules.map(item => {
        const classA = getTeamColorClass(item.teamA);
        const classB = getTeamColorClass(item.teamB);
        const formattedDate = formatDate(item.date);
        
        const details = item.details || [];
        const hasScore = details.some(d => Number(d.winA || 0) > 0 || Number(d.winB || 0) > 0);
        const isPastDate = new Date(item.date) < now;
        const isCompleted = hasScore || isPastDate;

        const detailRows = details.map(d => `
          <tr>
            <td class="match-title">${formatMatchTitle(d.matchName)}</td>
            <td class="players-cell">${renderPlayersWithScore(d.playersA)}</td>
            <td class="score-cell">
              <span class="${d.winA ? 'winner-pts' : ''}">${d.winA || 0}</span> : 
              <span class="${d.winB ? 'winner-pts' : ''}">${d.winB || 0}</span>
            </td>
            <td class="players-cell">${renderPlayersWithScore(d.playersB)}</td>
          </tr>
        `).join('');

        return `
          <div class="schedule-item ${isCompleted ? 'completed' : ''}" id="schedule-${item.id}">
            <div class="schedule-header" onclick="toggleScheduleDetail('${item.id}')">
              <div class="schedule-info">
                <span class="schedule-date">
                  ${formattedDate}
                  <span class="status-badge ${isCompleted ? 'badge-completed' : 'badge-upcoming'}">
                    ${isCompleted ? '완료' : '예정'}
                  </span>
                </span>
                <div class="schedule-teams">
                  <span class="${classA}">${item.teamA}</span>
                  <span style="color:var(--text-muted); font-size:0.75rem; font-weight:normal;">vs</span>
                  <span class="${classB}">${item.teamB}</span>
                </div>
              </div>
              <div class="schedule-result-box">
                <div class="schedule-score">${item.scoreA} : ${item.scoreB}</div>
                <span class="toggle-icon">▼</span>
              </div>
            </div>
            <div class="schedule-detail">
              <table class="detail-match-table">
                <thead>
                  <tr>
                    <th style="text-align:left; padding-left:2px;">경기</th>
                    <th>${item.teamA} 팀 (합 점수)</th>
                    <th style="white-space:nowrap;">결과</th>
                    <th>${item.teamB} 팀 (합 점수)</th>
                  </tr>
                </thead>
                <tbody>${detailRows}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleScheduleDetail(id) {
      const elem = document.getElementById(`schedule-${id}`);
      if (elem) elem.classList.toggle('active');
    }

    function renderStandings() {
      const standingsBody = document.getElementById('standingsBody');
      const teamStats = {};
      targetTeams.forEach(t => {
        teamStats[t] = { team: t, played: 0, win: 0, draw: 0, loss: 0, totalIndividualWins: 0, pts: 0 };
      });

      (matchSchedules || []).forEach(m => {
        const tA = teamStats[m.teamA];
        const tB = teamStats[m.teamB];

        if (tA && tB) {
          const details = m.details || [];
          const isPlayed = details.some(d => Number(d.winA || 0) > 0 || Number(d.winB || 0) > 0);

          if (isPlayed) {
            tA.played += 1;
            tB.played += 1;

            tA.totalIndividualWins += Number(m.scoreA || 0);
            tB.totalIndividualWins += Number(m.scoreB || 0);

            if (Number(m.scoreA) > Number(m.scoreB)) {
              tA.win += 1; tA.pts += 3; tB.loss += 1;
            } else if (Number(m.scoreB) > Number(m.scoreA)) {
              tB.win += 1; tB.pts += 3; tA.loss += 1;
            } else {
              tA.draw += 1; tA.pts += 1; tB.draw += 1; tB.pts += 1;
            }
          }
        }
      });

      const sortedTeams = Object.values(teamStats).sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        return b.totalIndividualWins - a.totalIndividualWins;
      });

      standingsBody.innerHTML = sortedTeams.map((t, idx) => {
        const colorClass = getTeamColorClass(t.team);
        const ptsDisplay = t.pts > 0 ? `+${t.pts}` : `${t.pts}`;

        return `
          <tr>
            <td class="rank-num">${idx + 1}</td>
            <td class="${colorClass}" style="font-weight:bold;">${t.team}</td>
            <td>${t.played}</td>
            <td>${t.win}/${t.draw}/${t.loss}</td>
            <td style="font-weight:bold;">${t.totalIndividualWins}점</td>
            <td class="pts-num">${ptsDisplay}</td>
          </tr>
        `;
      }).join('');
    }

    window.onload = () => {
      renderTeamView();
      loadSchedulesFromGoogleSheet();
    };
  </script>
</body>
</html>
